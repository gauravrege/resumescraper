<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Scraper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <!-- mammoth.js for DOCX parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.5.1/mammoth.browser.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-3xl shadow-xl max-w-4xl w-full border border-gray-100 flex flex-col items-center">
        <h1 class="text-4xl font-extrabold mb-2 text-gray-900 tracking-tight">AI Resume Scraper</h1>
        <p class="text-gray-500 mb-8 text-center max-w-xl text-lg">
            Instantly parse thousands of resumes (PDF & DOCX) into a clean, searchable Excel database. No server required.
        </p>

        <!-- Drag & Drop Zone -->
        <div id="dropzone" class="w-full max-w-2xl border-4 border-dashed border-indigo-200 rounded-3xl p-16 transition-all duration-300 ease-in-out cursor-pointer hover:border-indigo-500 hover:bg-indigo-50/50 hover:shadow-inner text-center">
            <svg class="mx-auto h-20 w-20 text-indigo-400 mb-6 drop-shadow-sm" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <p class="text-2xl font-bold text-gray-800 tracking-tight">Drag & Drop Resumes Here</p>
            <p class="text-gray-400 mt-2 text-lg">or</p>
            <button class="mt-4 px-6 py-2 bg-indigo-50 text-indigo-700 font-semibold rounded-full border border-indigo-200 hover:bg-indigo-100 transition-colors" onclick="document.getElementById('fileInput').click()">
                Browse Files
            </button>
            <p class="text-gray-400 mt-6 text-sm">Supports multiple <span class="font-semibold text-indigo-500">.pdf</span> and <span class="font-semibold text-indigo-500">.docx</span> files</p>
            <input type="file" id="fileInput" class="hidden" accept=".pdf, .docx, application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple>
        </div>

        <!-- Processing Status -->
        <div id="status" class="mt-8 hidden w-full max-w-2xl text-center">
            <p id="statusText" class="text-indigo-600 font-bold text-xl tracking-tight">Extracting Data...</p>
            <div class="w-full bg-gray-100 rounded-full h-3 mt-5 mb-3 overflow-hidden border border-gray-200">
                <div id="progressBar" class="bg-gradient-to-r from-indigo-500 to-purple-600 h-3 rounded-full transition-all duration-300 shadow-sm" style="width: 0%"></div>
            </div>
            <p id="progressText" class="text-sm font-medium text-gray-500">0 of 0 completed</p>
        </div>

        <!-- Success/Download Area -->
        <div id="result" class="mt-10 hidden flex flex-col items-center w-full max-w-6xl">
            <div class="bg-green-50 text-green-700 border border-green-200 px-6 py-3 rounded-2xl font-bold mb-8 flex items-center shadow-sm">
                <svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                <span id="successText" class="text-lg">Extraction Successful!</span>
            </div>
            
            <!-- Live Data Preview Table -->
            <div class="w-full bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden mb-8">
                <div class="overflow-x-auto max-h-[400px] overflow-y-auto">
                    <table class="w-full text-left text-sm text-gray-600">
                        <thead class="bg-indigo-50 text-indigo-900 sticky top-0 z-10 font-semibold shadow-sm">
                            <tr>
                                <th class="px-4 py-3 border-b">Candidate Name</th>
                                <th class="px-4 py-3 border-b">Email</th>
                                <th class="px-4 py-3 border-b">Phone</th>
                                <th class="px-4 py-3 border-b">Top Skills</th>
                            </tr>
                        </thead>
                        <tbody id="previewTableBody" class="divide-y divide-gray-100">
                            <!-- Rows will be injected here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="w-full max-w-sm grid gap-4">
                <button id="btnDownloadCombined" class="group relative w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-8 rounded-2xl shadow-lg hover:shadow-xl transition-all duration-200 flex items-center justify-center text-lg overflow-hidden">
                    <div class="absolute inset-0 w-full h-full bg-white/20 scale-x-0 group-hover:scale-x-100 transition-transform origin-left duration-300"></div>
                    <svg class="w-6 h-6 mr-3 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    <span class="relative z-10">Download Excel Database</span>
                </button>
            </div>
            
            <button id="resetBtn" class="mt-8 text-gray-500 hover:text-indigo-600 font-medium underline-offset-4 hover:underline text-sm transition-colors">
                Process more resumes
            </button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
